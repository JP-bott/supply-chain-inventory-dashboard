<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428 112" width="428" height="112" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Meridian Distribution Co.</title>
  <!-- Mark: a warehouse on a vertical meridian axis -->
  <rect x="0" y="0" width="112" height="112" rx="24" fill="#172B4D"/>
  <line x1="56" y1="14" x2="56" y2="98" stroke="#008C95" stroke-width="3" stroke-linecap="round"/>
  <circle cx="56" cy="13" r="5" fill="#008C95"/>
  <circle cx="56" cy="99" r="5" fill="#008C95"/>
  <polygon points="18,54 56,28 94,54 94,88 18,88" fill="#172B4D" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
  <rect x="38" y="60" width="36" height="28" fill="#008C95"/>
  <line x1="38" y1="69" x2="74" y2="69" stroke="#172B4D" stroke-width="2"/>
  <line x1="38" y1="78" x2="74" y2="78" stroke="#172B4D" stroke-width="2"/>
  <!-- Wordmark -->
  <text x="134" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700"
        fill="#172B4D" textLength="280" lengthAdjust="spacing">MERIDIAN</text>
  <text x="134" y="90" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600"
        fill="#008C95" textLength="280" lengthAdjust="spacing">DISTRIBUTION CO.</text>
</svg>
